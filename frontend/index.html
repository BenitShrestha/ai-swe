<!-- frontend/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ai-swe</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; }
    textarea { width: 100%; height: 120px; font-size: 14px; padding: 8px; box-sizing: border-box; }
    button { margin-top: 10px; padding: 8px 20px; font-size: 14px; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.6; }
    #status { margin-top: 16px; font-size: 14px; }
    #download { display: none; margin-top: 16px; }
  </style>
</head>
<body>
  <h2>ai-swe</h2>
  <p>Describe the app you want built:</p>
  <textarea id="prompt" placeholder="e.g. A simple calculator web application"></textarea>
  <br>
  <button id="generate">Generate</button>
  <div id="status"></div>
  <a id="download" href="#" download>Download project</a>

  <script src="/app.js"></script>
</body>
</html>
